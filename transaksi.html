<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Toko Sepatu Alfhariz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #2c3e50;
            --accent: #e74c3c;
            --bg-body: #f0f2f5;
            --white: #ffffff;
            --success: #00b894;
            --warning: #fdcb6e;
            --info: #0984e3;
            --sidebar-width: 250px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR (Menu Kiri) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: var(--white);
            position: fixed;
            height: 100%;
            padding: 20px;
            transition: 0.3s;
            z-index: 100;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
            text-decoration: none;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #bdc3c7;
            text-decoration: none;
            margin-bottom: 5px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255,255,255,0.1);
            color: var(--white);
            transform: translateX(5px);
        }

        .menu-item i { margin-right: 15px; width: 20px; }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2rem;
            width: calc(100% - var(--sidebar-width));
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .user-admin {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* --- DASHBOARD CARDS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s;
        }

        .card:hover { transform: translateY(-5px); }

        .card-info h3 { font-size: 2rem; margin-bottom: 5px; color: var(--primary); }
        .card-info p { color: #7f8c8d; font-size: 0.9rem; }
        
        .icon-box {
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; 
            align-items: center; justify-content: center;
            font-size: 1.5rem;
        }
        .bg-money { background: rgba(0, 184, 148, 0.1); color: var(--success); }
        .bg-order { background: rgba(9, 132, 227, 0.1); color: var(--info); }
        .bg-pending { background: rgba(253, 203, 110, 0.1); color: #d35400; }

        /* --- TABLE SECTION --- */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            animation: slideUp 0.8s ease;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th { text-align: left; padding: 15px; color: #7f8c8d; font-weight: 600; border-bottom: 2px solid #f0f2f5; }
        td { padding: 15px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
        
        tr { transition: background 0.2s; }
        tr:hover { background-color: #f8f9fa; }

        /* Badges */
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; font-weight: 600; }
        .b-pending { background: rgba(253, 203, 110, 0.2); color: #d35400; }
        .b-process { background: rgba(9, 132, 227, 0.2); color: var(--info); }
        .b-success { background: rgba(0, 184, 148, 0.2); color: var(--success); }

        /* Actions */
        .action-btn {
            border: none;
            background: none;
            cursor: pointer;
            padding: 5px;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .btn-edit { color: var(--info); }
        .btn-delete { color: var(--accent); }
        .action-btn:hover { transform: scale(1.2); }

        /* --- MODAL EDIT --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 400px;
            animation: zoomIn 0.3s;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        .btn-save {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 20px 10px; }
            .brand span, .menu-item span { display: none; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); }
            .menu-item i { margin-right: 0; font-size: 1.5rem; }
            .search-box input { width: 100%; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="#" class="brand">
            <i class="fas fa-shoe-prints"></i>
            <span>Alfhariz Admin</span>
        </a>
        <div class="menu">
            <a href="#" class="menu-item"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="#" class="menu-item active"><i class="fas fa-shopping-cart"></i> <span>Transaksi</span></a>
            <a href="#" class="menu-item"><i class="fas fa-box"></i> <span>Produk</span></a>
            <a href="#" class="menu-item"><i class="fas fa-users"></i> <span>Pelanggan</span></a>
            <a href="#" class="menu-item" style="margin-top: 50px; color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div>
                <h2 style="color: var(--primary);">Manajemen Pesanan</h2>
                <p style="color: #7f8c8d;">Kelola semua transaksi yang masuk di sini.</p>
            </div>
            <div class="user-admin">
                <img src="https://ui-avatars.com/api/?name=Admin+Alfhariz" style="border-radius: 50%; width: 35px;">
                <span>Halo, <b>Owner</b></span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="card">
                <div class="card-info">
                    <h3 id="totalRevenue">Rp 0</h3>
                    <p>Total Pemasukan</p>
                </div>
                <div class="icon-box bg-money"><i class="fas fa-wallet"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3 id="totalOrders">0</h3>
                    <p>Total Pesanan</p>
                </div>
                <div class="icon-box bg-order"><i class="fas fa-shopping-bag"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3 id="pendingOrders">0</h3>
                    <p>Perlu Diproses</p>
                </div>
                <div class="icon-box bg-pending"><i class="fas fa-clock"></i></div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>Daftar Transaksi Terbaru</h3>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari nama pembeli..." onkeyup="searchTable()">
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID Order</th>
                            <th>Pembeli</th>
                            <th>Produk</th>
                            <th>Tanggal</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <h3>Update Status Pesanan</h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <form id="editForm" onsubmit="saveStatus(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Nama Pembeli</label>
                    <input type="text" id="editName" disabled style="background: #eee;">
                </div>
                <div class="form-group">
                    <label>Status Pesanan</label>
                    <select id="editStatus">
                        <option value="pending">Pending (Belum Bayar)</option>
                        <option value="process">Dikemas / Dikirim</option>
                        <option value="success">Selesai</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script>
        // Data Dummy (Simulasi Database Toko)
        let orders = [
            { id: '#ORD-001', customer: 'Budi Santoso', product: 'Adidas Samba', date: '05 Feb 2026', price: 3380000, status: 'pending' },
            { id: '#ORD-002', customer: 'Siti Aminah', product: 'Nike Air Force 1', date: '04 Feb 2026', price: 1520000, status: 'process' },
            { id: '#ORD-003', customer: 'Ahmad Dani', product: 'GUCCI Sneakers', date: '01 Feb 2026', price: 93300000, status: 'success' },
            { id: '#ORD-004', customer: 'Dewi Persik', product: 'Vans Old School', date: '01 Feb 2026', price: 1390000, status: 'success' },
            { id: '#ORD-005', customer: 'Raffi Ahmad', product: 'Puma Sport', date: '05 Feb 2026', price: 2450000, status: 'pending' },
        ];

        // Format Rupiah
        const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        // Render Table & Stats
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let totalRev = 0;
            let countPending = 0;

            orders.forEach((order, index) => {
                // Hitung Statistik
                if(order.status === 'success') totalRev += order.price;
                if(order.status === 'pending') countPending++;

                // Tentukan Warna Badge
                let badgeClass = '';
                let statusText = '';
                if(order.status === 'pending') { badgeClass = 'b-pending'; statusText = 'Pending'; }
                else if(order.status === 'process') { badgeClass = 'b-process'; statusText = 'Dikirim'; }
                else { badgeClass = 'b-success'; statusText = 'Selesai'; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${order.id}</b></td>
                    <td>${order.customer}</td>
                    <td>${order.product}</td>
                    <td>${order.date}</td>
                    <td>${formatRupiah(order.price)}</td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                    <td>
                        <button class="action-btn btn-edit" onclick="openModal('${order.id}')" title="Edit Status"><i class="fas fa-edit"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteOrder('${order.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update Statistik Cards
            document.getElementById('totalRevenue').innerText = formatRupiah(totalRev);
            document.getElementById('totalOrders').innerText = orders.length;
            document.getElementById('pendingOrders').innerText = countPending;
        }

        // Search Function
        function searchTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const name = row.cells[1].innerText.toLowerCase();
                const id = row.cells[0].innerText.toLowerCase();
                if(name.includes(input) || id.includes(input)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Delete Order
        function deleteOrder(id) {
            if(confirm('Yakin ingin menghapus pesanan ini?')) {
                orders = orders.filter(o => o.id !== id);
                renderTable();
            }
        }

        // Modal Logic
        const modal = document.getElementById('editModal');
        let currentEditId = null;

        function openModal(id) {
            const order = orders.find(o => o.id === id);
            if(order) {
                currentEditId = id;
                document.getElementById('editId').value = id;
                document.getElementById('editName').value = order.customer;
                document.getElementById('editStatus').value = order.status;
                modal.style.display = 'flex';
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveStatus(e) {
            e.preventDefault();
            const newStatus = document.getElementById('editStatus').value;
            
            const orderIndex = orders.findIndex(o => o.id === currentEditId);
            if(orderIndex !== -1) {
                orders[orderIndex].status = newStatus;
                renderTable();
                closeModal();
                alert(`Status pesanan ${currentEditId} berhasil diupdate!`);
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initial Load
        renderTable();
    </script>
</body>
</html>
