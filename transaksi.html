<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Belanja - Alfhariz Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Menggunakan style yang sama dengan Beranda */
        :root { --primary: #1a1a1a; --accent: #e74c3c; --bg-light: #f4f7f6; }
        body { background: var(--bg-light); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        header { background: var(--primary); padding: 1rem 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { color: white; font-weight: bold; text-decoration: none; font-size: 1.5rem; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 20px; }
        .nav-links a.active { color: white; font-weight: bold; }

        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 2rem; }

        /* LIST CARD STYLE */
        .trx-card {
            background: white; padding: 1.5rem; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
        }
        .trx-info { display: flex; align-items: center; gap: 15px; }
        .trx-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #eee; }
        
        .status-badge {
            padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;
        }
        .st-dikemas { background: #fff3cd; color: #856404; } /* Kuning */
        .st-selesai { background: #d4edda; color: #155724; } /* Hijau */

        @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        
        /* Tombol Hapus Riwayat (Opsional) */
        .btn-clear { display: block; margin: 20px auto; background: none; border: 1px solid #ccc; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .btn-clear:hover { background: #eee; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Alfhariz Store</a>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="transaksi.html" class="active">Riwayat</a>
                <a href="tentang.html">Tentang</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h2>Riwayat Pesanan Saya</h2>
        <div id="trxList">
            </div>

        <button class="btn-clear" onclick="hapusRiwayat()">Hapus Semua Riwayat</button>
    </div>

    <script>
        const listContainer = document.getElementById('trxList');
        const fmt = (n) => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', minimumFractionDigits:0}).format(n);

        function loadRiwayat() {
            // AMBIL DATA DARI LOCALSTORAGE
            let history = JSON.parse(localStorage.getItem('riwayatBelanja')) || [];

            if (history.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#888;">Belum ada transaksi.</p>';
                return;
            }

            // Render HTML terbalik (yang baru di atas)
            listContainer.innerHTML = '';
            history.reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'trx-card';
                card.innerHTML = `
                    <div class="trx-info">
                        <img src="${item.img}" class="trx-img" onerror="this.src='https://via.placeholder.com/70'">
                        <div>
                            <h4 style="margin:0;">${item.product}</h4>
                            <small style="color:#666;">${item.date} • ${item.id}</small>
                            <div style="font-weight:bold; color:#e74c3c; margin-top:5px;">${fmt(item.price)}</div>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <span class="status-badge st-dikemas">${item.status}</span>
                        <br><br>
                        <a href="#" style="font-size:0.8rem; color:#1a1a1a;">Lacak Paket</a>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function hapusRiwayat() {
            if(confirm('Hapus semua riwayat belanja?')) {
                localStorage.removeItem('riwayatBelanja');
                loadRiwayat();
            }
        }

        // Jalankan saat halaman dibuka
        loadRiwayat();
    </script>
</body>
</html>
